name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install sqlite (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential libsqlite3-dev sqlite3

      - name: Install sqlite (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list sqlite >/dev/null 2>&1 || brew install sqlite
          # brew installs sqlite as keg-only because macOS ships its own.
          # Put brew's binaries first on PATH so the smoke test picks up the
          # newer, extension-capable build instead of Apple's stock CLI.
          echo "$(brew --prefix sqlite)/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          uname -a
          cc --version | head -1
          which sqlite3
          sqlite3 --version

      - name: Build
        run: make

      - name: Test
        run: make test
