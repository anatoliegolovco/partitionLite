name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install sqlite (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential libsqlite3-dev sqlite3

      - name: Install sqlite (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list sqlite >/dev/null 2>&1 || brew install sqlite
          SQLITE_PREFIX="$(brew --prefix sqlite)"
          echo "$SQLITE_PREFIX/bin" >> "$GITHUB_PATH"
          echo "SQLITE_PREFIX=$SQLITE_PREFIX" >> "$GITHUB_ENV"

      - name: Build (with diagnostics)
        run: |
          set +e
          PRE_DIAG=""
          if [ "${{ runner.os }}" = "macOS" ]; then
            PRE_DIAG="$(printf 'SQLITE_PREFIX=%s | which-sqlite3=%s | sqlite3-version=%s | cc=%s' \
                "${SQLITE_PREFIX:-?}" \
                "$(which sqlite3)" \
                "$(sqlite3 --version 2>&1 | tr -d '\n')" \
                "$(cc --version 2>&1 | head -1 | tr -d '\n')" )"
          fi
          make 2>build.err
          ec=$?
          if [ $ec -ne 0 ]; then
            echo "::error title=Build failed (${{ runner.os }})::pre={$PRE_DIAG} :: build_err=$(tr '\n' '|' < build.err | head -c 1500)"
            exit $ec
          fi
          ARTIFACTS="$(ls -la ts_partition.* 2>&1 | tr '\n' '|')"
          echo "Built artifacts: $ARTIFACTS"
          if ! ls ts_partition.so >/dev/null 2>&1 && ! ls ts_partition.dylib >/dev/null 2>&1; then
            echo "::error title=No extension built (${{ runner.os }})::pre={$PRE_DIAG} :: artifacts=$ARTIFACTS"
            exit 1
          fi

      - name: Test (with diagnostics)
        run: |
          set +e
          # Probe sqlite3 extension capability before running the test
          PROBE1="$(sqlite3 :memory: "SELECT load_extension('/tmp/nope.so') IS NULL;" 2>&1 | tr '\n' '|')"
          PROBE2="$(sqlite3 :memory: ".load /tmp/nope.so" 2>&1 | tr '\n' '|')"
          make test >test.out 2>&1
          ec=$?
          if [ $ec -ne 0 ]; then
            TAIL="$(tail -40 test.out | tr '\n' '|' | head -c 2000)"
            echo "::error title=Test failed (${{ runner.os }})::PATH=$PATH :: which=$(which sqlite3) :: ver=$(sqlite3 --version 2>&1) :: probe_load_ext={$PROBE1} :: probe_dotload={$PROBE2} :: tail={$TAIL}"
            exit $ec
          fi
          echo "Test passed"
