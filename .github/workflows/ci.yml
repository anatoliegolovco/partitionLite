name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install sqlite (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              build-essential libsqlite3-dev sqlite3

      - name: Install sqlite (macOS)
        if: runner.os == 'macOS'
        run: |
          set -x
          brew list sqlite >/dev/null 2>&1 || brew install sqlite
          SQLITE_PREFIX="$(brew --prefix sqlite)"
          echo "$SQLITE_PREFIX/bin" >> "$GITHUB_PATH"
          {
            echo "## Install sqlite (macOS)"
            echo "- SQLITE_PREFIX: \`$SQLITE_PREFIX\`"
            echo "- bin contents:"
            echo '```'
            ls -la "$SQLITE_PREFIX/bin" 2>&1 || echo "(no bin dir at $SQLITE_PREFIX/bin)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose toolchain
        run: |
          set +e
          {
            echo "## Toolchain (${{ runner.os }})"
            echo "- uname: \`$(uname -a)\`"
            echo "- cc: \`$(cc --version 2>&1 | head -1)\`"
            echo "- PATH: \`$PATH\`"
            echo "- which sqlite3: \`$(which sqlite3)\`"
            echo "- sqlite3 --version: \`$(sqlite3 --version 2>&1)\`"
            echo
            echo "### load_extension probe"
            echo '```'
            sqlite3 :memory: \
              "SELECT load_extension('/tmp/__nonexistent__.so') IS NULL;" 2>&1
            ec=$?
            echo "(exit $ec)"
            echo '```'
            echo
            echo "### .load probe via dot-command"
            echo '```'
            sqlite3 :memory: ".load /tmp/__nonexistent__.so" 2>&1
            ec=$?
            echo "(exit $ec)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: |
          set -x
          make 2>&1 | tee /tmp/build.log
          ec=${PIPESTATUS[0]}
          {
            echo "## Build (${{ runner.os }})"
            echo '```'
            tail -50 /tmp/build.log
            echo "(exit $ec)"
            echo '```'
            echo
            echo "### artifacts"
            echo '```'
            ls -la ts_partition.* 2>&1 || echo "(no ts_partition.* in $(pwd))"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$ec"

      - name: Test
        run: |
          set -x
          set +e
          make test 2>&1 | tee /tmp/test.log
          ec=${PIPESTATUS[0]}
          {
            echo "## Test (${{ runner.os }})"
            echo "exit: $ec"
            echo
            echo "### tail of test output"
            echo '```'
            tail -80 /tmp/test.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$ec"
